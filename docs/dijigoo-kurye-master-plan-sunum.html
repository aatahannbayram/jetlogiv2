<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0E1213;color:var(--ink)}

}
.slide{

}
.slide.on{display:flex;flex-direction:column}
.slide h1{font-family:Archivo,sans-serif;font-size:clamp(28px,3.4vw,44px);line-height:1.08;letter-spacing:-.022em;margin:0 0 16px;text-wrap:balance}

.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}

.p-hi{background:var(--hi-bg);color:var(--hi)}

table{width:100%;border-collapse:collapse;font-family:Archivo,sans-serif;font-size:14.5px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}

td{padding:10px 14px;border-bottom:1px solid var(--rule);color:var(--ink-2);vertical-align:top}
td:first-child{color:var(--ink);font-weight:600}
tr:last-child td{border-bottom:0}
.bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:#E1E7E5}

.nav{

#print-root{display:none}

<script>
const slides = [...document.getElementById('slides').content.querySelectorAll('.slide')];
const stage = document.getElementById('stage');
const printRoot = document.getElementById('print-root');
slides.forEach((src, n) => {
  const s = src.cloneNode(true);
  s.classList.add('on');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = s.dataset.who || '';
  s.appendChild(who);
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = `<i style="width:${((n+1)/slides.length)*100}%"></i>`;
  s.appendChild(bar);
  printRoot.appendChild(s);
});
let i = 0;
function render(){
  stage.innerHTML = '';
  const s = slides[i].cloneNode(true);
  s.classList.add('on');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = s.dataset.who || '';
  s.appendChild(who);
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = `<i style="width:${((i+1)/slides.length)*100}%"></i>`;
  s.appendChild(bar);
  stage.appendChild(s);
  document.getElementById('pos').textContent = `${i+1} / ${slides.length}`;
}
function go(d){ i = Math.max(0, Math.min(slides.length-1, i+d)); render(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
window.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)) { e.preventDefault(); go(1); }
  if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
  if (e.key === 'Home') { i = 0; render(); }
  if (e.key === 'End') { i = slides.length-1; render(); }
});
render();
</script>
